<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor OTs · FAS</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#0B1220;transform-origin:0 0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0B1220;color:#F1F5F9;font-family:"Segoe UI",Roboto,Arial,sans-serif;cursor:none}
#top{height:97.2px;display:flex;align-items:center;justify-content:space-between;padding:0 57.6px;background:#111A2E;border-bottom:6px solid;border-image:linear-gradient(90deg,#560F12,#F27231,#A2C146) 1}
#top .t{font-size:34.6px;font-weight:800;letter-spacing:.05em}
#top .t span{color:#F27231}
#clock{font-size:43.2px;font-weight:700;font-variant-numeric:tabular-nums}
#sync{font-size:19.4px;color:#64748B;text-align:right;display:flex;align-items:center;gap:15.4px}
#sync i{width:15.1px;height:15.1px;border-radius:50%;background:#EF4444;display:inline-block}
#sync i.ok{background:#A2C146}
#stage{height:918px;position:relative}
.slide{position:absolute;inset:0;padding:32.4px 57.6px;opacity:0;transition:opacity .8s;display:flex;flex-direction:column}
.slide.on{opacity:1}
#bar{height:10.8px;background:#1E293B}
#barIn{height:100%;width:0;background:#F27231}
#dots{position:absolute;bottom:64.8px;right:57.6px;display:flex;gap:11.5px;z-index:5}
#dots i{width:13px;height:13px;border-radius:50%;background:#334155}
#dots i.on{background:#F27231}
.h1{font-size:54px;font-weight:800;margin-bottom:27px}
.grid{flex:1;display:grid;gap:21.6px 38.4px;grid-template-columns:repeat(auto-fit,minmax(422.4px,1fr));align-content:start}
.tile{background:#131D33;border-radius:21.6px;padding:27px 38.4px;display:flex;align-items:center;gap:38.4px;border-left:13px solid}
.tile .n{font-size:97.2px;font-weight:900;line-height:1;min-width:108px;text-align:center}
.tile .nm{font-size:38.9px;font-weight:700}
.tile .sub{font-size:23.8px;color:#94A3B8;margin-top:5.4px}
.tec{flex:1;display:grid;grid-template-columns:422.4px minmax(0,1fr);gap:57.6px;align-items:center}
.light{background:#05080F;border-radius:64.8px;padding:32.4px 0;display:flex;flex-direction:column;align-items:center;gap:32.4px;width:345.6px;margin:auto}
.light b{width:183.6px;height:183.6px;border-radius:50%;background:#1F2937;opacity:.25}
.light b.r.on{background:#EF4444;opacity:1;box-shadow:0 0 86.4px #EF4444}
.light b.y.on{background:#FACC15;opacity:1;box-shadow:0 0 86.4px #FACC15}
.light b.g.on{background:#A2C146;opacity:1;box-shadow:0 0 86.4px #A2C146}
.who{font-size:86.4px;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1340px}
.big{display:flex;align-items:baseline;gap:38.4px;margin:10.8px 0}
.big .num{font-size:216px;font-weight:900;line-height:.9}
.big .lbl{font-size:48.6px;font-weight:700;color:#CBD5E1}
.msg{font-size:38.9px;font-weight:800;padding:16.2px 38.4px;border-radius:16.2px;display:inline-block;margin-bottom:27px}
.list{display:flex;flex-direction:column;gap:13px}
.it{display:flex;gap:24px;align-items:center;background:#131D33;border-radius:13px;padding:12px 24px;font-size:22px;min-width:0}
.it .id{color:#F27231;font-weight:900;min-width:130px;font-size:30px}
.it .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .dp{flex-shrink:0;font-size:18px;padding:3.2px 19.2px;border-radius:21.6px;border:2.2px solid;font-weight:700}
.it .d{font-weight:900;min-width:110px;text-align:right;font-size:30px}
.nw{font-size:19.4px;font-weight:900;padding:3.2px 15.4px;border-radius:21.6px;background:#DC2626;color:#fff;animation:bl 1s infinite}
.alarm{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{background:#0B1220}50%{background:#560F12}}
.blink{animation:bl 1s infinite}
@keyframes bl{50%{opacity:.35}}
.rk{display:flex;align-items:center;gap:38.4px;background:#131D33;border-radius:16.2px;padding:17.3px 38.4px;font-size:36.7px;font-weight:700}
.rk .pos{width:115.2px;font-size:48.6px;text-align:center}
.rk .nm{width:537.6px}
.rk .track{flex:1;height:32.4px;background:#0B1220;border-radius:21.6px;overflow:hidden}
.rk .fill{height:100%;background:linear-gradient(90deg,#A2C146,#C5DB7E);border-radius:21.6px}
.rk .c{width:153.6px;text-align:right;font-size:48.6px;font-weight:900;color:#C5DB7E}
#alerta{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:43.2px 96px}
#alerta.on{display:flex}
#alerta.nueva{background:radial-gradient(circle,#560F12 0%,#1A0405 75%);animation:flash 1s infinite}
#alerta.listo{background:radial-gradient(circle,#4A5E1C 0%,#0E1405 75%)}
@keyframes flash{50%{filter:brightness(1.35)}}
#alerta .ic{font-size:172.8px;line-height:1}
#alerta .ti{font-size:75.6px;font-weight:900;letter-spacing:.04em;margin:21.6px 0 10.8px}
#alerta .who{font-size:118.8px}
#alerta .sub{font-size:43.2px;color:#F9A27A;margin:21.6px 0}
#alerta .list{width:1440px;text-align:left}
#err{position:absolute;bottom:21.6px;left:57.6px;font-size:21.6px;color:#F87171;z-index:5}
#start{position:absolute;inset:0;background:#0B1220;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:21.6px;z-index:30;cursor:pointer;font-size:32.4px}
#start b{font-size:64.8px}
.tec>div{min-width:0}
.list{min-width:0}
.hoy{display:inline-block;margin:10px 0 4px;padding:10px 22px;border-radius:14px;background:#3D1A0C;border:3px solid #F27231;color:#FBC4A6;font-size:30px;font-weight:600;animation:hoyp 2s infinite}
.hoy b{color:#fff;font-weight:900}
@keyframes hoyp{50%{box-shadow:0 0 28px #F2723188}}
</style>
</head>
<body>
<div id="app">
<div id="start"><b>Monitor de OTs · FAS</b><div>Clic para iniciar (activa pantalla completa y sonido)</div></div>
<div id="top">
  <div class="t">ÓRDENES DE TRABAJO · <span>FAS</span></div>
  <div id="clock">--:--</div>
  <div id="sync"><i id="dot"></i><span id="syncTx">Conectando…</span></div>
</div>
<div id="stage"></div>
<div id="bar"><div id="barIn"></div></div>
<div id="dots"></div>
<div id="err"></div>
<div id="alerta"></div>
</div>
<script>
// ═════════ FIREBASE ═════════
const firebaseConfig = {
  apiKey: "AIzaSyAHIa42h2xu1tMeZcxCDbC6hz9fmkI0UXM",
  authDomain: "ots-fas.firebaseapp.com",
  projectId: "ots-fas",
  storageBucket: "ots-fas.firebasestorage.app",
  messagingSenderId: "653993679654",
  appId: "1:653993679654:web:08e50aa255ac6ff8267fe7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// El monitor no usa caché local: así el indicador "En vivo" refleja la conexión real
const FV = firebase.firestore.FieldValue;
const REF_ESTADO  = db.doc("ots/estado");   // {orders:[], completadas:{id:fecha}}
const REF_CONFIG  = db.doc("ots/config");   // configuración del monitor
const REF_EVENTOS = db.doc("ots/eventos");  // {nuevas:[], listos:[]}
const COL_HIST    = db.collection("historial"); // un documento por OT completada

const CONFIG_DEF = {rojoCant:6,rojoDias:7,amaCant:3,amaDias:3,segSlide:12,durAlerta:10,horaIni:6,horaFin:18,
  alertaNueva:true,alertaListo:true,sonidoNueva:3,sonidoListo:6,volumen:6,ranking:true,verCeros:true,ocultos:[]};

// ═════════ SONIDOS ═════════
const SONIDOS = ["Sin sonido","Ding-dong","Campanita","Aviso aeropuerto","Alarma corta","Sirena","Logro"];
let _AC=null, VOL=0.6;
function ac(){ _AC=_AC||new (window.AudioContext||window.webkitAudioContext)(); if(_AC.state==="suspended") _AC.resume(); return _AC; }
function tone(f,t,d,type,v){ const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type=type||"sine"; o.frequency.value=f;
  const vol=(v||.35)*VOL; g.gain.setValueAtTime(0,c.currentTime+t); g.gain.linearRampToValueAtTime(vol,c.currentTime+t+.02);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d); o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+d+.05); }
function sonar(n){
  try{
    if(n===1){ tone(880,0,.9); tone(659,.45,1.2); }
    else if(n===2){ tone(1047,0,.5); tone(1319,.18,.5); tone(1568,.36,.9); }
    else if(n===3){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*.28,.7,"triangle"); }); }
    else if(n===4){ for(let i=0;i<6;i++) tone(1200,i*.22,.15,"square",.2); }
    else if(n===5){ const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type="sawtooth"; g.gain.value=.15*VOL;
      for(let i=0;i<4;i++){ o.frequency.setValueAtTime(600,c.currentTime+i*.6); o.frequency.linearRampToValueAtTime(1100,c.currentTime+i*.6+.3); o.frequency.linearRampToValueAtTime(600,c.currentTime+i*.6+.6); }
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+2.4); }
    else if(n===6){ [523,659,784].forEach(function(f,i){ tone(f,i*.12,.4); }); [523,659,784,1047].forEach(function(f){ tone(f,.45,1.2,"sine",.18); }); }
  }catch(_){}
}

// ═════════ UTILIDADES ═════════
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function parseFecha(f){
  if(f==null||f==="") return null;
  if(typeof f==="number"||/^\d+(\.\d+)?$/.test(f)) return new Date(Math.round((+f-25569)*864e5));
  const m=String(f).match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})(?:[,\s]+(\d{1,2}):(\d{2}))?/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  const d=new Date(f); return isNaN(d)?null:d;
}
const H24 = 24*3600*1000;

const DEPT = {COCINA:"#F59E0B",BODEGAMP:"#3B82F6",BODEGAPT:"#8B5CF6",POSTRES:"#EC4899",LOGISTICA:"#14B8A6",COMEDOR:"#F97316",DECORACION:"#A78BFA",BATIDOS:"#22D3EE",PILAS:"#84CC16",MANTENIMIENTO:"#6B7280",ETIQUETAS:"#FB923C",SANIDAD:"#34D399"};
const COL = {r:"#EF4444",y:"#FACC15",g:"#A2C146"};
const OCULTAR = ["Sin asignar"];
let CFG = Object.assign({},CONFIG_DEF), ESTADO = null, NUEVAS = {}, EV_NUEVAS = [], SEMANA = [];
let slides = [], idx = 0, tick = 0, cola = [], alertaHasta = 0, primeraVez = true;
let lastSeen = +(localStorage.getItem("mon_lastSeen")||0) || Date.now();

function dias(f){ const d=parseFecha(f); return d?Math.max(0,Math.floor((Date.now()-d)/864e5)):0; }
function nombreCorto(t){ const p=t.split(/\s+/); return p.length>1?p[0]+" "+p[1][0]+".":t; }
function nivel(n,maxD){
  if(n>=CFG.rojoCant||maxD>=CFG.rojoDias) return "r";
  if(n>=CFG.amaCant||maxD>=CFG.amaDias) return "y";
  return "g";
}
function msg(l,n){
  if(n===0) return "✅ ¡Al día! Sin OTs pendientes";
  if(l==="r") return "🚨 ¡ATENCIÓN! Revisá la PC de OTs y marcá las listas";
  if(l==="y") return "⚠️ Tenés OTs esperando — pasá por la PC de OTs";
  return "👍 Vas bien — mantené las OTs al día";
}
function enHorario(){ const h=new Date().getHours(); return h>=CFG.horaIni&&h<CFG.horaFin; }
function dColor(d){ return d>=CFG.rojoDias?COL.r:d>=CFG.amaDias?COL.y:"#94A3B8"; }
function itemHtml(o,colorDp){
  const c=colorDp||DEPT[String(o.depto).toUpperCase()]||"#6B7280";
  const n=NUEVAS[o.id]?"<span class=\"nw\">"+(NUEVAS[o.id].tipo==="reasignada"?"REASIGNADA":"NUEVA")+"</span>":"";
  return "<div class=\"it\"><span class=\"id\">#"+esc(o.id)+"</span><span class=\"tx\">"+esc(o.activo)+"</span>"+n
    +"<span class=\"dp\" style=\"color:"+c+";border-color:"+c+"\">"+esc(o.depto)+"</span>"
    +(o.d!=null?"<span class=\"d\" style=\"color:"+dColor(o.d)+"\">"+o.d+" d</span>":"")+"</div>";
}

function oculto(t){ return (CFG.ocultos||[]).indexOf(t)>=0; }
function calcular(){
  const comp=ESTADO.completadas||{}, porTec={};
  (ESTADO.orders||[]).forEach(o=>{ if(oculto(o.tec)) return; porTec[o.tec]=porTec[o.tec]||[]; if(!comp[o.id]) porTec[o.tec].push(Object.assign({},o,{d:dias(o.fecha)})); });
  return Object.keys(porTec).map(t=>{
    const l=porTec[t].sort((a,b)=>(NUEVAS[b.id]?1:0)-(NUEVAS[a.id]?1:0)||b.d-a.d);
    const maxD=l.reduce((m,o)=>Math.max(m,o.d),0);
    return {tec:t,lista:l,n:l.length,maxD,niv:nivel(l.length,maxD),nuevas:asignadasHoy(t).length};
  }).sort((a,b)=>"ryg".indexOf(a.niv)-"ryg".indexOf(b.niv)||b.n-a.n);
}

function slideResumen(tecs){
  const vis=tecs.filter(t=>!OCULTAR.includes(t.tec));
  const total=vis.reduce((s,t)=>s+t.n,0);
  const sinAsig=tecs.filter(t=>OCULTAR.includes(t.tec)).reduce((s,t)=>s+t.n,0);
  return {html:"<div class=\"h1\">Resumen · "+total+" OTs pendientes"+(sinAsig?" · <span style=\"color:#F87171\">"+sinAsig+" sin asignar</span>":"")+"</div>"
    +"<div class=\"grid\">"+vis.map(t=>"<div class=\"tile\" style=\"border-color:"+COL[t.niv]+"\">"
      +"<div class=\"n\" style=\"color:"+COL[t.niv]+"\">"+t.n+"</div><div><div class=\"nm\">"+esc(nombreCorto(t.tec))+"</div>"
      +"<div class=\"sub\">"+(t.n?"Más antigua: "+t.maxD+" día"+(t.maxD==1?"":"s"):"Al día")+"</div>"
      +(t.nuevas?"<div class=\"sub\" style=\"color:#F27231;font-weight:800\">🔔 "+t.nuevas+" nueva"+(t.nuevas==1?"":"s")+" hoy</div>":"")
      +"</div></div>").join("")+"</div>"};
}
function inicioHoy(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function asignadasHoy(tec){ const h=inicioHoy(); return Object.values(NUEVAS).filter(n=>n.tec===tec&&n.ts>=h).sort((a,b)=>a.ts-b.ts); }
function bannerHoy(tec){
  const l=asignadasHoy(tec); if(!l.length) return "";
  const u=new Date(l[l.length-1].ts);
  const dia=u.toLocaleDateString("es-CR",{weekday:"long"});
  const hora=u.toLocaleTimeString("es-CR",{hour:"numeric",minute:"2-digit"});
  const txt=l.length===1?"Se te asignó <b>1 OT nueva</b> hoy "+dia+" a las <b>"+hora+"</b>"
                        :"Se te asignaron <b>"+l.length+" OTs nuevas</b> hoy "+dia+" · la última a las <b>"+hora+"</b>";
  return "<div class=\"hoy\">🔔 "+txt+"</div>";
}
function slideTec(t){
  const ban=bannerHoy(t.tec), top=t.lista.slice(0,ban?3:4), resto=t.n-top.length, c=COL[t.niv];
  return {alarm:t.niv==="r",html:"<div class=\"tec\">"
    +"<div class=\"light\"><b class=\"r "+(t.niv==="r"?"on":"")+"\"></b><b class=\"y "+(t.niv==="y"?"on":"")+"\"></b><b class=\"g "+(t.niv==="g"?"on":"")+"\"></b></div>"
    +"<div><div class=\"who\">"+esc(t.tec)+"</div>"+ban
    +"<div class=\"big\"><span class=\"num\" style=\"color:"+c+"\">"+t.n+"</span><span class=\"lbl\">OT"+(t.n==1?"":"s")+" pendiente"+(t.n==1?"":"s")
    +(t.n?"<br>la más antigua: "+t.maxD+" día"+(t.maxD==1?"":"s"):"")+"</span></div>"
    +"<div class=\"msg "+(t.niv==="r"?"blink":"")+"\" style=\"background:"+c+"22;color:"+c+";border:3.2px solid "+c+"\">"+msg(t.niv,t.n)+"</div>"
    +"<div class=\"list\">"+top.map(o=>itemHtml(o)).join("")
    +(resto>0?"<div style=\"font-size:25.9px;color:#94A3B8\">…y "+resto+" más</div>":"")+"</div></div></div>"};
}
function slideSinAsignar(t){
  return {alarm:true,html:"<div class=\"h1\" style=\"color:#F87171\">🚨 "+t.n+" OT"+(t.n==1?"":"s")+" SIN ASIGNAR — ¡alguien tómela en la PC!</div>"
    +"<div class=\"list\">"+t.lista.slice(0,7).map(o=>itemHtml(o,"#F87171")).join("")+"</div>"};
}
function slideRanking(){
  const cnt={};
  SEMANA.forEach(h=>{ cnt[h.tec]=(cnt[h.tec]||0)+1; });
  const tecs=[...new Set((ESTADO.orders||[]).map(o=>o.tec).concat(Object.keys(cnt)))].filter(t=>!OCULTAR.includes(t)&&!oculto(t));
  const arr=tecs.map(t=>({t,c:cnt[t]||0})).sort((a,b)=>b.c-a.c);
  const max=Math.max(1,...arr.map(a=>a.c)), med=["🥇","🥈","🥉"];
  return {html:"<div class=\"h1\">🏆 Ranking de la semana · OTs completadas</div><div class=\"list\" style=\"gap:15.1px\">"
    +arr.map((a,i)=>"<div class=\"rk\"><span class=\"pos\">"+(a.c&&i<3?med[i]:(i+1))+"</span><span class=\"nm\">"+esc(nombreCorto(a.t))+"</span>"
      +"<span class=\"track\"><span class=\"fill\" style=\"display:block;width:"+(a.c/max*100)+"%\"></span></span><span class=\"c\">"+a.c+"</span></div>").join("")+"</div>"};
}

function construir(){
  if(!ESTADO) return;
  const h0=inicioHoy(); NUEVAS={}; EV_NUEVAS.forEach(n=>{ if(n.ts>=h0) NUEVAS[n.id]=n; });
  const tecs=calcular();
  slides=[slideResumen(tecs)];
  tecs.filter(t=>OCULTAR.includes(t.tec)&&t.n).forEach(t=>slides.push(slideSinAsignar(t)));
  tecs.filter(t=>!OCULTAR.includes(t.tec)&&(CFG.verCeros||t.n)).forEach(t=>slides.push(slideTec(t)));
  if(CFG.ranking) slides.push(slideRanking());
  document.getElementById("stage").innerHTML=slides.map((s,i)=>"<div class=\"slide\" id=\"s"+i+"\">"+s.html+"</div>").join("");
  document.getElementById("dots").innerHTML=slides.map(()=>"<i></i>").join("");
  if(idx>=slides.length) idx=0;
  mostrar(idx);
}
function mostrar(i){
  document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===i));
  document.querySelectorAll("#dots i").forEach((el,k)=>el.classList.toggle("on",k===i));
  document.body.classList.toggle("alarm",!!(slides[i]&&slides[i].alarm));
}

// ═════════ ALERTAS ═════════
function procesarCola(){
  const el=document.getElementById("alerta");
  if(Date.now()<alertaHasta) return;
  if(!cola.length){ el.className=""; return; }
  const a=cola.shift();
  if(a.tipo==="nueva"){
    const n=a.items.length, re=a.items.every(x=>x.tipo==="reasignada");
    el.className="on nueva";
    el.innerHTML="<div class=\"ic\">🔔</div><div class=\"ti\">"+(re?"OT REASIGNADA":"NUEVA ASIGNACIÓN")+"</div>"
      +"<div class=\"who\">"+esc(a.tec)+"</div><div class=\"sub\">Tenés "+n+" OT"+(n==1?"":"s")+" nueva"+(n==1?"":"s")+" — revisá la PC de OTs</div>"
      +"<div class=\"list\">"+a.items.slice(0,4).map(o=>itemHtml(o)).join("")+(n>4?"<div style=\"font-size:28.1px\">…y "+(n-4)+" más</div>":"")+"</div>";
    if(enHorario()) sonar(CFG.sonidoNueva);
    alertaHasta=Date.now()+CFG.durAlerta*1000;
  }else{
    el.className="on listo";
    el.innerHTML="<div class=\"ic\">✅</div><div class=\"ti\">¡OT COMPLETADA!</div><div class=\"who\">"+esc(a.tec)+"</div>"
      +"<div class=\"sub\" style=\"color:#DCEBB0\">cerró la OT #"+esc(a.id)+" · "+esc(a.activo)+"</div>";
    if(enHorario()) sonar(CFG.sonidoListo);
    alertaHasta=Date.now()+Math.max(4,Math.round(CFG.durAlerta*0.6))*1000;
  }
}

// ═════════ FIREBASE EN VIVO ═════════
let _offT=null;
function conexion(ok){
  if(!ok){ if(!_offT) _offT=setTimeout(function(){ _offT=null; pintarCx(false); },15000); return; }
  clearTimeout(_offT); _offT=null; pintarCx(true);
}
function pintarCx(ok){
  document.getElementById("dot").className=ok?"ok":"";
  document.getElementById("syncTx").textContent=ok?"En vivo":"Sin conexión — mostrando últimos datos";
}
REF_ESTADO.onSnapshot({includeMetadataChanges:true},function(s){
  conexion(!s.metadata.fromCache);
  if(!s.exists) return;
  ESTADO=s.data(); construir();
},function(e){ document.getElementById("err").textContent="⚠ "+e.message; });

REF_CONFIG.onSnapshot({includeMetadataChanges:true},function(s){
  conexion(!s.metadata.fromCache);
  CFG=Object.assign({},CONFIG_DEF,s.exists?s.data():{}); VOL=CFG.volumen/10; construir();
});

REF_EVENTOS.onSnapshot({includeMetadataChanges:true},function(s){
  conexion(!s.metadata.fromCache);
  if(s.metadata.hasPendingWrites===false&&s.metadata.fromCache&&!s.exists) return;
  const d=s.exists?s.data():{}, lim=Date.now()-H24;
  EV_NUEVAS=d.nuevas||[];
  let max=lastSeen;
  if(CFG.alertaNueva){
    const grupos={};
    (d.nuevas||[]).filter(n=>n.ts>lastSeen&&!oculto(n.tec)).forEach(n=>{ (grupos[n.tec]=grupos[n.tec]||[]).push(n); });
    Object.keys(grupos).forEach(t=>cola.push({tipo:"nueva",tec:t,items:grupos[t]}));
  }
  if(CFG.alertaListo) (d.listos||[]).filter(n=>n.ts>lastSeen&&!oculto(n.tec)).sort((a,b)=>a.ts-b.ts).forEach(n=>cola.push(Object.assign({tipo:"listo"},n)));
  (d.nuevas||[]).concat(d.listos||[]).forEach(n=>{ if(n.ts>max) max=n.ts; });
  lastSeen=max; try{ localStorage.setItem("mon_lastSeen",String(max)); }catch(_){}
  construir();
});

function lunes(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
COL_HIST.where("completadoTs",">=",lunes()).onSnapshot(function(s){ SEMANA=s.docs.map(x=>x.data()); construir(); },function(){});

// ═════════ RELOJ Y ROTACIÓN ═════════
setInterval(function(){
  document.getElementById("clock").textContent=new Date().toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"});
  procesarCola();
  if(!slides.length||Date.now()<alertaHasta) return;
  tick++;
  document.getElementById("barIn").style.width=(tick/CFG.segSlide*100)+"%";
  if(tick>=CFG.segSlide){ tick=0; idx=(idx+1)%slides.length; mostrar(idx); }
},1000);
setInterval(function(){ construir(); },300000);
// recarga diaria a las 5:00 (memoria + ranking de la semana)
setInterval(function(){ const n=new Date(); if(n.getHours()===5&&n.getMinutes()===0) location.reload(); },60000);

// ═════════ AJUSTE A CUALQUIER PANTALLA (lienzo 16:9 escalado) ═════════
function escalar(){ const k=Math.min(innerWidth/1920,innerHeight/1080), a=document.getElementById("app");
  a.style.transform="scale("+k+")"; a.style.left=((innerWidth-1920*k)/2)+"px"; a.style.top=((innerHeight-1080*k)/2)+"px"; }
addEventListener("resize",escalar); escalar();
addEventListener("offline",function(){ pintarCx(false); });

// ═════════ INICIO ═════════
async function iniciar(fs){
  const st=document.getElementById("start"); if(st) st.remove();
  try{ ac(); }catch(_){}
  if(fs){ try{ await document.documentElement.requestFullscreen(); }catch(_){} }
  try{ if("wakeLock" in navigator){ await navigator.wakeLock.request("screen");
    document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState==="visible") try{ await navigator.wakeLock.request("screen"); }catch(_){} }); } }catch(_){}
}
document.getElementById("start").onclick=function(){ iniciar(true); };
if(/[?&]kiosk=1/.test(location.search)) iniciar(false);
document.addEventListener("click",function(){ try{ ac(); }catch(_){} });
document.addEventListener("keydown",function(e){
  if(!slides.length) return;
  if(e.key==="ArrowRight"){ idx=(idx+1)%slides.length; tick=0; mostrar(idx); }
  if(e.key==="ArrowLeft"){ idx=(idx-1+slides.length)%slides.length; tick=0; mostrar(idx); }
  if(e.key==="Enter"){ alertaHasta=0; procesarCola(); }
});
</script>
